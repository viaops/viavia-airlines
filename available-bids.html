<style>

body{

header{

.arrow{

.info-grid{

.info-value{

.legs{

.legs-title{

    font-weight:800;
    margin-bottom:8px;

    flex-wrap:wrap;

.no-results{

.bid-message{

.submitted-bid{

.submitted-bid strong{

}

.submitted-bid small{
    display:block;
    margin-top:4px;

footer{
    text-align:center;
    color:#776d7e;
    font-size:13px;
    padding:28px 20px 40px;
}

@media(max-width:950px){

    .filter-grid{
        grid-template-columns:repeat(2,1fr);

    header{

    }

<script>

/* ============================================================
   VIAVIA AVAILABLE BIDS
============================================================ */


/* ------------------------------------------------------------
   Read stored bids
------------------------------------------------------------ */

function getBids(){

    try{

        const stored =
            localStorage.getItem(
                "viaviaBids"
            );

        if(!stored){
            return [];
        }

        const parsed =
            JSON.parse(stored);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(error){

        console.error(
            "Could not read bids:",
            error
        );

        return [];

    }

}


/* ------------------------------------------------------------
   Save bids
------------------------------------------------------------ */

function saveBids(bids){

    localStorage.setItem(
        "viaviaBids",
        JSON.stringify(bids)
    );

}


/* ------------------------------------------------------------
   Get authoritative pairings
------------------------------------------------------------ */

function getPairings(){

    if(
        typeof generateViaviaPairings !==
        "function"
    ){

        console.error(
            "generateViaviaPairings() is unavailable."
        );

        return [];

    }


    return generateViaviaPairings({
        maxLegs:3
    });

}


/* ------------------------------------------------------------
   Aircraft helper
------------------------------------------------------------ */

function pairingAircraft(pairing){

    if(
        Array.isArray(
            pairing.aircraft
        )
    ){

        return pairing.aircraft;

    }


    if(
        Array.isArray(
            pairing.legs
        )
    ){

        return [
            ...new Set(
                pairing.legs
                    .map(
                        leg =>
                            leg.aircraft
                    )
                    .filter(Boolean)
            )
        ];

    }


    if(pairing.aircraft){

        return [
            pairing.aircraft
        ];

    }


    return [];

}


/* ------------------------------------------------------------
   Pairing flight list
------------------------------------------------------------ */

function pairingFlights(pairing){

    if(
        Array.isArray(
            pairing.legs
        )
    ){

        return pairing.legs;

    }


    if(
        Array.isArray(
            pairing.flights
        )
    ){

        return pairing.flights;

    }


    return [];

}


/* ------------------------------------------------------------
   Route
------------------------------------------------------------ */

function getRoute(pairing){

    const flights =
        pairingFlights(pairing);


    if(!flights.length){
        return "—";
    }


    return (
        flights[0].origin +
        " → " +
        flights[
            flights.length - 1
        ].destination
    );

}


/* ------------------------------------------------------------
   Duration
------------------------------------------------------------ */

function formatDuration(minutes){

    const value =
        Number(minutes);


    if(!Number.isFinite(value)){
        return "—";
    }


    const hours =
        Math.floor(value / 60);


    const mins =
        value % 60;


    if(hours === 0){

        return `${mins} min`;

    }


    return `${hours}h ${mins}m`;

}


/* ------------------------------------------------------------
   Escape HTML
------------------------------------------------------------ */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ------------------------------------------------------------
   Determine whether bid already exists
------------------------------------------------------------ */

function hasBid(pairing){

    const bids =
        getBids();


    return bids.some(
        bid =>
            String(
                bid.pairingId
            ) ===
            String(
                pairing.id
            )
    );

}


/* ------------------------------------------------------------
   Submit bid
------------------------------------------------------------ */

function submitBid(pairingId){

    const pairings =
        getPairings();


    const pairing =
        pairings.find(
            item =>
                String(item.id) ===
                String(pairingId)
        );


    if(!pairing){

        alert(
            "Unable to find this pairing."
        );

        return;

    }


    let bids =
        getBids();


    if(
        bids.some(
            bid =>
                String(
                    bid.pairingId
                ) ===
                String(pairing.id)
        )
    ){

        alert(
            "You have already submitted this bid."
        );

        return;

    }


    const flights =
        pairingFlights(pairing);


    const aircraft =
        pairingAircraft(pairing);


    const firstFlight =
        flights[0];


    const lastFlight =
        flights[
            flights.length - 1
        ];


    /*
     * Trip 001 remains the authoritative
     * RSW → MDE → RSW pairing.
     */

    const bid = {

        bidId:
            "BID-" +
            Date.now(),

        pairingId:
            pairing.id,

        tripId:
            pairing.id,

        tripNumber:
            pairing.tripNumber ||
            pairing.id,

        pilotName:
            "Captain",

        pilotId:
            "PILOT-001",

        pilotStatus:
            "Captain",

        base:
            pairing.base,

        fleet:
            aircraft.join(" / "),

        aircraft:
            aircraft,

        route:
            getRoute(pairing),

        legCount:
            flights.length,

        flightNumbers:
            flights.map(
                flight =>
                    flight.flightNumber
            ),

        flights:
            flights.map(
                flight => ({
                    flightNumber:
                        flight.flightNumber,

                    origin:
                        flight.origin,

                    destination:
                        flight.destination,

                    departure:
                        flight.departure,

                    arrival:
                        flight.arrival,

                    aircraft:
                        flight.aircraft,

                    base:
                        flight.base,

                    nextDay:
                        Boolean(
                            flight.nextDay
                        )
                })
            ),

        startAirport:
            firstFlight
                ? firstFlight.origin
                : "",

        endAirport:
            lastFlight
                ? lastFlight.destination
                : "",

        startTime:
            firstFlight
                ? firstFlight.departure
                : "",

        endTime:
            lastFlight
                ? lastFlight.arrival
                : "",

        durationMinutes:
            Number(
                pairing.durationMinutes ||
                0
            ),

        connectionMinutes:
            Number(
                pairing.connectionMinutes ||
                0
            ),

        overnight:
            Boolean(
                pairing.overnight
            ),

        gateStatus:
            "TBD — Gate assignment pending",

        status:
            "submitted",

        assignmentStatus:
            "pending",

        awarded:
            false,

        held:
            false,

        denied:
            false,

        submittedAt:
            new Date().toISOString(),

        updatedAt:
            new Date().toISOString(),

        awardedAt:
            null,

        awardedBy:
            null,

        assignedTrip:
            null,

        assignedFlights:
            null

    };


    bids.push(bid);

    saveBids(bids);


    showMessage(
        "Bid submitted successfully. Crew Scheduling will review the bid."
    );


    renderPairings();

    renderSubmittedBids();

}


/* ------------------------------------------------------------
   Message
------------------------------------------------------------ */

function showMessage(message){

    const box =
        document.getElementById(
            "bidMessage"
        );


    box.textContent =
        message;


    box.style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });


    setTimeout(
        () => {
            box.style.display =
                "none";
        },
        5000
    );

}


/* ------------------------------------------------------------
   Render available pairings
------------------------------------------------------------ */

function renderPairings(){

    const list =
        document.getElementById(
            "tripList"
        );


    const base =
        document.getElementById(
            "baseFilter"
        ).value;


    const fleet =
        document.getElementById(
            "fleetFilter"
        ).value;


    const length =
        document.getElementById(
            "lengthFilter"
        ).value;


    const search =
        document.getElementById(
            "searchFilter"
        ).value
        .toLowerCase()
        .trim();


    const pairings =
        getPairings();


    const filtered =
        pairings.filter(
            pairing => {

                const flights =
                    pairingFlights(
                        pairing
                    );


                const aircraft =
                    pairingAircraft(
                        pairing
                    );


                const route =
                    getRoute(
                        pairing
                    );


                const flightNumbers =
                    flights.map(
                        flight =>
                            flight.flightNumber
                    ).join(" ");


                const airports =
                    flights.map(
                        flight =>
                            flight.origin +
                            " " +
                            flight.destination
                    ).join(" ");


                const matchesBase =
                    base === "ALL" ||
                    pairing.base === base;


                const matchesFleet =
                    fleet === "ALL" ||
                    aircraft.includes(
                        fleet
                    );


                const matchesLength =
                    length === "ALL" ||
                    String(
                        flights.length
                    ) === length;


                const searchText =
                    (
                        route +
                        " " +
                        flightNumbers +
                        " " +
                        airports
                    ).toLowerCase();


                const matchesSearch =
                    !search ||
                    searchText.includes(
                        search
                    );


                return (
                    matchesBase &&
                    matchesFleet &&
                    matchesLength &&
                    matchesSearch
                );

            }
        );


    if(!filtered.length){

        list.innerHTML = `

            <div class="no-results">

                <h2>
                    No Available Pairings
                </h2>

                <p>
                    No pairings match the current
                    filters.
                </p>

            </div>

        `;

        return;

    }


    list.innerHTML =
        filtered
            .map(
                renderPairing
            )
            .join("");

}


/* ------------------------------------------------------------
   Render individual pairing
------------------------------------------------------------ */

function renderPairing(pairing){

    const flights =
        pairingFlights(pairing);


    if(!flights.length){
        return "";
    }


    const first =
        flights[0];


    const last =
        flights[
            flights.length - 1
        ];


    const aircraft =
        pairingAircraft(
            pairing
        );


    const submitted =
        hasBid(
            pairing
        );


    const tripNumber =
        pairing.tripNumber ||
        pairing.id;


    const isTrip001 =
        String(
            pairing.id
        ) === "TRIP-001";


    const button =
        submitted

        ?

        `
        <button
            class="button secondary"
            disabled
        >
            Bid Submitted
        </button>
        `

        :

        `
        <button
            class="button"
            onclick="submitBid('${escapeHtml(pairing.id)}')"
        >
            Bid This Trip
        </button>
        `;


    return `

        <article class="trip-card">

            <div class="trip-top">

                <div>

                    <div class="trip-title">

                        ${escapeHtml(
                            tripNumber
                        )}

                    </div>

                    <div class="trip-subtitle">

                        ${escapeHtml(
                            pairing.base
                        )}
                        Base
                        ·
                        ${flights.length}
                        Legs
                        ·
                        ${escapeHtml(
                            getRoute(pairing)
                        )}

                    </div>

                </div>


                <div class="badge">

                    ${
                        isTrip001
                        ?
                        "Featured Pairing"
                        :
                        "Available"
                    }

                </div>

            </div>


            <div class="route">

                <div>

                    <div class="airport">

                        ${escapeHtml(
                            first.origin
                        )}

                    </div>

                    <div class="time">

                        ${escapeHtml(
                            first.departure
                        )}

                    </div>

                </div>


                <div class="arrow">
                    →
                </div>


                <div>

                    <div class="airport">

                        ${escapeHtml(
                            last.destination
                        )}

                    </div>

                    <div class="time">

                        ${escapeHtml(
                            last.arrival
                        )}
                        ${
                            last.nextDay
                            ? "+1"
                            : ""
                        }

                    </div>

                </div>

            </div>


            <div class="info-grid">

                <div class="info">

                    <div class="info-label">
                        Base
                    </div>

                    <div class="info-value">
                        ${escapeHtml(
                            pairing.base
                        )}
                    </div>

                </div>


                <div class="info">

                    <div class="info-label">
                        Aircraft
                    </div>

                    <div class="info-value">
                        ${escapeHtml(
                            aircraft.join(" / ")
                        )}
                    </div>

                </div>


                <div class="info">

                    <div class="info-label">
                        Legs
                    </div>

                    <div class="info-value">
                        ${flights.length}
                    </div>

                </div>


                <div class="info">

                    <div class="info-label">
                        Duration
                    </div>

                    <div class="info-value">
                        ${formatDuration(
                            pairing.durationMinutes
                        )}
                    </div>

                </div>


                <div class="info">

                    <div class="info-label">
                        Connection
                    </div>

                    <div class="info-value">
                        ${formatDuration(
                            pairing.connectionMinutes
                        )}
                    </div>

                </div>

            </div>


            <div class="legs">

                <div class="legs-title">
                    Flight Schedule
                </div>


                ${
                    flights
                        .map(
                            flight => `

                                <div class="leg">

                                    <strong>
                                        ${escapeHtml(
                                            flight.flightNumber
                                        )}
                                    </strong>

                                    <span>
                                        ${escapeHtml(
                                            flight.origin
                                        )}
                                        →
                                        ${escapeHtml(
                                            flight.destination
                                        )}
                                    </span>

                                    <span>
                                        ${escapeHtml(
                                            flight.departure
                                        )}
                                        –
                                        ${escapeHtml(
                                            flight.arrival
                                        )}
                                        ${
                                            flight.nextDay
                                            ? "+1"
                                            : ""
                                        }
                                    </span>

                                    <span>
                                        ${escapeHtml(
                                            flight.aircraft
                                        )}
                                    </span>

                                </div>

                            `
                        )
                        .join("")
                }

            </div>


            <div class="gate">

                <strong>Gate:</strong>

                TBD — Gate assignment pending

            </div>


            <div class="actions">

                ${button}


                <a
                    class="button secondary"
                    href="flight-planning.html?flight=${encodeURIComponent(
                        first.flightNumber
                    )}"
                >
                    Flight Planning
                </a>


                ${
                    isTrip001

                    ?

                    `
                    <a
                        class="button secondary"
                        href="trip-001.html"
                    >
                        View Trip 001
                    </a>
                    `

                    :

                    ""
                }

            </div>

        </article>

    `;

}


/* ------------------------------------------------------------
   Submitted bids
------------------------------------------------------------ */

function renderSubmittedBids(){

    const container =
        document.getElementById(
            "submittedBids"
        );


    const bids =
        getBids();


    const submitted =
        bids.filter(
            bid =>
                String(
                    bid.status || ""
                ).toLowerCase() ===
                "submitted"
        );


    if(!submitted.length){

        container.innerHTML = `

            <p style="color:#75687c;">
                You have no submitted bids.
            </p>

        `;

        return;

    }


    container.innerHTML =
        submitted
            .map(
                bid => `

                    <div class="submitted-bid">

                        <strong>

                            ${escapeHtml(
                                bid.tripNumber ||
                                bid.pairingId ||
                                "Trip"
                            )}

                        </strong>

                        <small>

                            ${escapeHtml(
                                bid.route ||
                                ""
                            )}

                            ·

                            ${escapeHtml(
                                bid.base ||
                                ""
                            )}

                            ·

                            Pending Crew Scheduling

                        </small>

                    </div>

                `
            )
            .join("");

}


/* ------------------------------------------------------------
   Storage updates
------------------------------------------------------------ */

window.addEventListener(
    "storage",
    event => {

        if(
            event.key ===
            "viaviaBids"
        ){

            renderPairings();

            renderSubmittedBids();

        }

    }
);

renderPairings();

renderSubmittedBids();
