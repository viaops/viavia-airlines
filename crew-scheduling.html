<script>
function resolvePairingFromMaster(bid) {

    if (!bid) {
        return null;
    }

    const pairings =
        getPairings();

    /*
     * ========================================================
     * STEP 1
     * CHECK THE STORED TRIP ID FIRST
     * ========================================================
     *
     * This is the important fix.
     *
     * Older bids may already contain a valid TRIP-### but may
     * not contain flightNumbers.
     *
     * The old version rejected those bids before ever checking
     * their Trip ID.
     */

    const possibleIds = [

        bid.pairingId,
        bid.tripId,
        bid.tripNumber,
        bid.pairing,
        bid.assignedTrip

    ]
    .filter(Boolean)
    .map(function(value) {

        return String(value)
            .trim()
            .toUpperCase();

    })
    .filter(function(value) {

        return /^TRIP-\d+$/.test(value);

    });

    /*
     * Try the master schedule's pairing lookup directly.
     */
    for (
        let i = 0;
        i < possibleIds.length;
        i++
    ) {

        const tripId =
            possibleIds[i];

        /*
         * First use getViaviaPairing if the master schedule
         * provides it.
         */
        if (
            typeof getViaviaPairing ===
            "function"
        ) {

            try {

                const directPairing =
                    getViaviaPairing(
                        tripId
                    );

                if (
                    directPairing &&
                    directPairing.pairingId
                ) {

                    return directPairing;
                }

            } catch (error) {

                console.warn(
                    "Direct Viavia pairing lookup failed:",
                    tripId,
                    error
                );
            }
        }

        /*
         * Fall back to the generated pairing list.
         */
        const pairingById =
            pairings.find(
                function(candidate) {

                    return (
                        String(
                            candidate.pairingId ||
                            ""
                        )
                        .trim()
                        .toUpperCase() ===
                        tripId
                    );

                }
            );

        if (pairingById) {
            return pairingById;
        }
    }

    /*
     * ========================================================
     * STEP 2
     * GET THE BID'S FLIGHT NUMBERS
     * ========================================================
     */

    const bidNumbers =
        getBidFlightNumbers(
            bid
        );

    /*
     * We deliberately do NOT check this until AFTER the Trip ID.
     */
    if (!bidNumbers.length) {

        console.warn(
            "Bid has no resolvable Trip ID or flight numbers:",
            bid
        );

        return null;
    }

    /*
     * ========================================================
     * STEP 3
     * MATCH THE EXACT FLIGHT SEQUENCE
     * ========================================================
     */

    let pairing =
        pairings.find(
            function(candidate) {

                return sameFlightSequence(
                    candidate.flightNumbers,
                    bidNumbers
                );

            }
        );

    if (pairing) {
        return pairing;
    }

    /*
     * ========================================================
     * STEP 4
     * TRIP 001 PERMANENT SAFETY RULE
     * ========================================================
     *
     * Trip 001 is permanently:
     *
     * VIA1757 RSW-MDE
     * VIA1758 MDE-RSW
     */

    if (
        bidNumbers.length === 2 &&
        bidNumbers[0] ===
            "VIA1757" &&
        bidNumbers[1] ===
            "VIA1758"
    ) {

        const outbound =
            getMasterFlight(
                "VIA1757"
            );

        const inbound =
            getMasterFlight(
                "VIA1758"
            );

        if (
            outbound &&
            inbound
        ) {

            return {

                pairingId:
                    "TRIP-001",

                base:
                    "RSW",

                flights: [
                    outbound,
                    inbound
                ],

                flightNumbers: [
                    "VIA1757",
                    "VIA1758"
                ],

                legs:
                    2,

                route:
                    "RSW → MDE → RSW",

                aircraft: [
                    "A320"
                ],

                startAirport:
                    "RSW",

                endAirport:
                    "RSW",

                closed:
                    true,

                gateStatus:
                    GATE_PENDING
            };
        }
    }

    /*
     * ========================================================
     * STEP 5
     * REBUILD USING THE MASTER FLIGHT SCHEDULE
     * ========================================================
     */

    const masterFlights =
        bidNumbers.map(
            getMasterFlight
        );

    /*
     * Every flight must actually exist in the master schedule.
     */
    if (
        masterFlights.some(
            function(flight) {
                return !flight;
            }
        )
    ) {

        console.error(
            "One or more bid flights do not exist in the Viavia master schedule:",
            bidNumbers
        );

        return null;
    }

    /*
     * Make sure the legs form a real continuous pairing.
     */
    for (
        let i = 1;
        i < masterFlights.length;
        i++
    ) {

        if (
            masterFlights[i - 1]
                .destination !==
            masterFlights[i]
                .origin
        ) {

            console.error(
                "Bid flights do not form a continuous Viavia pairing:",
                bidNumbers
            );

            return null;
        }
    }

    const base =
        bid.base ||
        masterFlights[0].base ||
        masterFlights[0].origin;

    /*
     * Search the generated pairing engine again using the
     * authoritative master flights.
     */

    pairing =
        pairings.find(
            function(candidate) {

                return sameFlightSequence(
                    candidate.flightNumbers,
                    bidNumbers
                );

            }
        );

    if (pairing) {
        return pairing;
    }

    /*
     * ========================================================
     * STEP 6
     * FINAL SAFE RECONSTRUCTION
     * ========================================================
     *
     * We still DO NOT invent a Trip number.
     *
     * A legitimate TRIP-### must already exist in the bid.
     */

    const reconstructedId =
        possibleIds.length
            ? possibleIds[0]
            : null;

    if (!reconstructedId) {

        console.error(
            "Flights exist, but no Viavia Trip ID could be identified:",
            bidNumbers
        );

        return null;
    }

    const routeParts = [
        masterFlights[0].origin
    ];

    masterFlights.forEach(
        function(flight) {

            routeParts.push(
                flight.destination
            );

        }
    );

    const aircraft =
        [
            ...new Set(
                masterFlights.map(
                    function(flight) {

                        return flight.aircraft;

                    }
                )
            )
        ];

    return {

        pairingId:
            reconstructedId,

        base:
            base,

        flights:
            masterFlights,

        flightNumbers:
            bidNumbers.slice(),

        legs:
            masterFlights.length,

        route:
            routeParts.join(
                " → "
            ),

        aircraft:
            aircraft,

        startAirport:
            masterFlights[0].origin,

        endAirport:
            masterFlights[
                masterFlights.length - 1
            ].destination,

        closed:
            masterFlights[0].origin ===
            masterFlights[
                masterFlights.length - 1
            ].destination,

        gateStatus:
            GATE_PENDING
    };
}
</script>
