.trip-meta{

.detail{

.detail-label{

<script>

/* ============================================================
   VIAVIA CREW CALENDAR
============================================================ */


let bids =
    JSON.parse(
        localStorage.getItem(
            "viaviaBids"
        ) || "[]"
    );


let currentWeek =
    getMonday(
        new Date()
    );


let pairings = [];


/* ============================================================
   TIME HELPERS
============================================================ */


function timeToMinutes(time){

    const parts =
        time.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );

}


function blockMinutes(flight){

    let departure =
        timeToMinutes(
            flight.departure
        );


    let arrival =
        timeToMinutes(
            flight.arrival
        );


    if(
        flight.nextDay ||
        arrival < departure
    ){

        arrival += 1440;

    }


    return arrival - departure;

}


/* ============================================================
   PAIRING GENERATION
============================================================ */


function getReturnFlight(
    outbound,
    base
){

    const outboundArrival =
        timeToMinutes(
            outbound.arrival
        ) +
        (
            outbound.nextDay
            ? 1440
            : 0
        );


    const candidates =
        VIAVIA_SCHEDULE.flights
        .filter(
            flight => {

                return (
                    flight.origin ===
                    outbound.destination &&

                    flight.destination ===
                    base &&

                    flight.base ===
                    base
                );

            }
        )
        .map(
            flight => {

                let departure =
                    timeToMinutes(
                        flight.departure
                    );


                while(
                    departure <
                    outboundArrival + 35
                ){

                    departure += 1440;

                }


                return {
                    flight,
                    departure
                };

            }
        )
        .sort(
            (a,b) =>
                a.departure -
                b.departure
        );


    return candidates.length
        ? candidates[0].flight
        : null;

}


/*
   Generate the same basic real-schedule pairings
   used by the bid system.

   Trip 001 is explicitly preserved.
*/

function buildPairings(){

    const flights =
        VIAVIA_SCHEDULE.flights;


    const bases =
        VIAVIA_SCHEDULE.airline.pilotBases;


    const results = [];


    /* --------------------------------------------------------
       TRIP 001
    -------------------------------------------------------- */

    const trip001Outbound =
        flights.find(
            flight =>
                flight.flightNumber ===
                "VIA1757"
        );


    const trip001Return =
        flights.find(
            flight =>
                flight.flightNumber ===
                "VIA1758"
        );


    if(
        trip001Outbound &&
        trip001Return
    ){

        results.push({

            id:"Trip 001",

            base:"RSW",

            legs:[
                trip001Outbound,
                trip001Return
            ],

            days:1,

            credit:
                blockMinutes(
                    trip001Outbound
                ) +
                blockMinutes(
                    trip001Return
                )

        });

    }


    /* --------------------------------------------------------
       OTHER REAL TURNS
    -------------------------------------------------------- */

    bases.forEach(
        base => {

            flights
            .filter(
                flight =>
                    flight.base === base &&
                    flight.origin === base
            )
            .forEach(
                outbound => {

                    if(
                        outbound.flightNumber ===
                        "VIA1757"
                    ){
                        return;
                    }


                    const returnFlight =
                        getReturnFlight(
                            outbound,
                            base
                        );


                    if(
                        !returnFlight
                    ){
                        return;
                    }


                    const exists =
                        results.some(
                            trip =>
                                trip.legs.some(
                                    flight =>
                                        flight.flightNumber ===
                                        outbound.flightNumber
                                )
                        );


                    if(exists){
                        return;
                    }


                    results.push({

                        id:"",

                        base:base,

                        legs:[
                            outbound,
                            returnFlight
                        ],

                        days:1,

                        credit:
                            blockMinutes(
                                outbound
                            ) +
                            blockMinutes(
                                returnFlight
                            )

                    });

                }
            );

        }
    );


    /*
       Number trips consistently.
    */

    let number =
        1;


    results.forEach(
        trip => {

            if(
                trip.id !==
                "Trip 001"
            ){

                number++;

                trip.id =
                    `Trip ${
                        String(number)
                        .padStart(3,"0")
                    }`;

            }

        }
    );


    return results;

}


/* ============================================================
   FIND BID PAIRINGS
============================================================ */


function getBidPairings(){

    const all =
        buildPairings();


    /*
       Match submitted trip IDs
       against the generated pairing list.
    */

    return all.filter(
        trip =>
            bids.includes(
                trip.id
            )
    );

}


/* ============================================================
   CALENDAR DATE HELPERS
============================================================ */


function getMonday(date){

    const d =
        new Date(date);


    const day =
        d.getDay();


    const difference =
        day === 0
        ? -6
        : 1 - day;


    d.setDate(
        d.getDate() +
        difference
    );


    d.setHours(
        0,0,0,0
    );


    return d;

}


function formatDate(date){

    return date.toLocaleDateString(
        "en-US",
        {
            month:"short",
            day:"numeric"
        }
    );

}


function formatLongDate(date){

    return date.toLocaleDateString(
        "en-US",
        {
            weekday:"long",
            month:"long",
            day:"numeric"
        }
    );

}


/*
   The master schedule contains recurring
   daily times rather than calendar dates.

   We therefore display the awarded pairing
   in the current calendar week as an operational
   planning view.
*/


function getDayIndex(trip){

    const first =
        trip.legs[0];


    const departure =
        timeToMinutes(
            first.departure
        );


    /*
       Spread trips through the week
       deterministically based on their ID.
    */

    if(
        trip.id === "Trip 001"
    ){

        return 1;

    }


    const number =
        Number(
            trip.id.replace(
                "Trip ",
                ""
            )
        );


    return (
        number %
        7
    );

}


/* ============================================================
   RENDER SUMMARY
============================================================ */


function renderSummary(){

    const awarded =
        getBidPairings();


    document.getElementById(
        "bidCount"
    ).textContent =
        bids.length;


    document.getElementById(
        "awardedCount"
    ).textContent =
        awarded.length;


    document.getElementById(
        "totalLegs"
    ).textContent =
        awarded.reduce(
            (total,trip) =>
                total +
                trip.legs.length,
            0
        );


    /*
       Display a base if the awarded
       trips identify one.
    */

    const bases =
        [
            ...new Set(
                awarded.map(
                    trip =>
                        trip.base
                )
            )
        ];


    document.getElementById(
        "pilotBase"
    ).textContent =
        bases.length === 1
        ? bases[0]
        : bases.length
            ? bases.join(" / ")
            : "—";

}


/* ============================================================
   RENDER WEEK
============================================================ */


function renderCalendar(){

    const calendar =
        document.getElementById(
            "calendar"
        );


    calendar.innerHTML = "";


    const awarded =
        getBidPairings();


    const endDate =
        new Date(
            currentWeek
        );


    endDate.setDate(
        endDate.getDate() + 6
    );


    document.getElementById(
        "weekTitle"
    ).textContent =
        `${formatDate(currentWeek)} – ${formatDate(endDate)}`;


    for(
        let i = 0;
        i < 7;
        i++
    ){

        const date =
            new Date(
                currentWeek
            );


        date.setDate(
            date.getDate() + i
        );


        const day =
            document.createElement(
                "div"
            );


        day.className =
            "day";


        const header =
            document.createElement(
                "div"
            );


        header.className =
            "day-header";


        header.innerHTML = `

<div class="day-name">

${date.toLocaleDateString(
    "en-US",
    {
        weekday:"short"
    }
)}

</div>


<div class="day-number">

${date.getDate()}

</div>

`;


        day.appendChild(
            header
        );


        const content =
            document.createElement(
                "div"
            );


        content.className =
            "day-content";


        const trips =
            awarded.filter(
                trip =>
                    getDayIndex(
                        trip
                    ) === i
            );


        if(
            trips.length === 0
        ){

            content.innerHTML = `

<div class="no-trip">
No trip scheduled
</div>

`;

        }
        else{

            trips.forEach(
                trip => {

                    const event =
                        document.createElement(
                            "div"
                        );


                    event.className =
                        "trip-event";


                    event.onclick =
                        () =>
                            scrollToTrip(
                                trip.id
                            );


                    const first =
                        trip.legs[0];


                    const last =
                        trip.legs[
                            trip.legs.length - 1
                        ];


                    event.innerHTML = `

<strong>
${trip.id}
</strong>

<small>
${trip.base}
→
${first.destination}
</small>

<small>
${trip.legs.length}
leg${trip.legs.length === 1 ? "" : "s"}
·
${first.departure}
report
</small>

<small>
Release
${last.arrival}
${last.nextDay ? "+1" : ""}
</small>

`;


                    content.appendChild(
                        event
                    );

                }
            );

        }


        day.appendChild(
            content
        );


        calendar.appendChild(
            day
        );

    }

}


/* ============================================================
   RENDER TRIP LIST
============================================================ */


function renderTripList(){

    const container =
        document.getElementById(
            "tripList"
        );


    container.innerHTML = "";


    const awarded =
        getBidPairings();


    if(
        awarded.length === 0
    ){

        container.innerHTML = `

<div class="card empty">

You currently have no submitted bids appearing on your crew calendar.

<br><br>

Go to
<strong>Available Bids</strong>
to submit a trip.

</div>

`;

        return;

    }


    awarded.forEach(
        trip => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card trip-card";


            card.id =
                `trip-${trip.id.replace(/\s/g,"")}`;


            const first =
                trip.legs[0];


            const last =
                trip.legs[
                    trip.legs.length - 1
                ];


            const aircraft =
                [
                    ...new Set(
                        trip.legs.map(
                            flight =>
                                flight.aircraft
                        )
                    )
                ].join(" / ");


            const legsHTML =
                trip.legs
                .map(
                    (flight,index) => {

                        return `

<div class="leg">

<strong>
LEG ${index + 1}
</strong>

<span>
${flight.flightNumber}
</span>

<span>
${flight.origin}
→
${flight.destination}
</span>

<span>
${flight.departure}
–
${flight.arrival}
${flight.nextDay ? "+1" : ""}
</span>

</div>

`;

                    }
                )
                .join("");


            card.innerHTML = `

<div class="trip-header">

<div>

<div class="trip-number">
${trip.id}
</div>

<div class="trip-meta">

${trip.base} Base ·
Submitted Bid ·
${trip.legs.length} Legs

</div>

</div>


<div class="status">
SUBMITTED
</div>

</div>


<div class="route">

<div>

<div class="airport">
${first.origin}
</div>

</div>


<div class="arrow">
→
</div>


<div>

<div class="airport">
${last.destination}
</div>

</div>

</div>


<div class="trip-details">


<div class="detail">

<div class="detail-label">
Legs
</div>

<div class="detail-value">
${trip.legs.length}
</div>

</div>


<div class="detail">

<div class="detail-label">
Aircraft
</div>

<div class="detail-value">
${aircraft}
</div>

</div>


<div class="detail">

<div class="detail-label">
Trip Days
</div>

<div class="detail-value">
${trip.days}
</div>

</div>


<div class="detail">

<div class="detail-label">
Credit
</div>

<div class="detail-value">

${Math.floor(trip.credit / 60)}:
${String(trip.credit % 60).padStart(2,"0")}

</div>

</div>


</div>


<div class="leg-list">

${legsHTML}

</div>


<div class="gate-note">

Gate assignment:

<strong>
${VIAVIA_SCHEDULE.operations.gatePendingText}
</strong>

until within 12 hours of the scheduled departure.

</div>

`;


            container.appendChild(
                card
            );

        }
    );

}


/* ============================================================
   SCROLL TO TRIP
============================================================ */


function scrollToTrip(id){

    const element =
        document.getElementById(
            `trip-${id.replace(/\s/g,"")}`
        );


    if(element){

        element.scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }

}


/* ============================================================
   WEEK NAVIGATION
============================================================ */


function previousWeek(){

    currentWeek.setDate(
        currentWeek.getDate() - 7
    );


    renderCalendar();

}


function nextWeek(){

    currentWeek.setDate(
        currentWeek.getDate() + 7
    );


    renderCalendar();

}


function today(){

    currentWeek =
        getMonday(
            new Date()
        );


    renderCalendar();

}
